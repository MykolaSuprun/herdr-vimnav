id = "preview-grid"
name = "Preview Grid"
version = "0.4.1"
min_herdr_version = "0.9.3"
description = "Master-detail switcher for spaces or agents: live pane previews, fuzzy search, MRU priority sort, sidebar jump codes"
platforms = ["linux", "macos"]

# Built at install time; linked dev builds can `go build -o bin/herdr-preview-grid ./cmd/herdr-preview-grid`.
[[build]]
command = ["sh", "-c", "CGO_ENABLED=0 go build -o bin/herdr-preview-grid ./cmd/herdr-preview-grid"]

# Prefer the built binary; fall back to `go run` so a freshly linked checkout works immediately.
# Actions run WITHOUT a TTY (like simple-switcher) — they delegate to the pane entrypoints.
[[actions]]
id = "spaces"
title = "Switch space (preview grid)"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin preview-grid --entrypoint spaces"]

[[actions]]
id = "agents"
title = "Switch agent (preview grid)"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin preview-grid --entrypoint agents"]

[[panes]]
id = "spaces"
title = "Preview Grid"
placement = "overlay"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid spaces; else exec go run ./cmd/herdr-preview-grid spaces; fi"]

[[panes]]
id = "agents"
title = "Preview Grid"
placement = "overlay"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid agents; else exec go run ./cmd/herdr-preview-grid agents; fi"]

# Record navigation activity into the MRU ledger (feeds the priority sort's
# "recently active"). Focus events fire for ALL navigation from ANY client —
# keybindings, sidebar, clicks — so the ledger tracks real usage, not just
# picker jumps. Hooks run with cwd = plugin root. Hook commands use the same
# binary-or-`go run` fallback as the panes, so a linked checkout without a
# built binary degrades to `go run` instead of dying silently.
[[events]]
on = "workspace.focused"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid record; else exec go run ./cmd/herdr-preview-grid record; fi"]

[[events]]
on = "pane.focused"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid record; else exec go run ./cmd/herdr-preview-grid record; fi"]

# Keep the sidebar's $jump codes in sync with the live layout. [[startup]]
# covers the initial population and server restarts (which wipe reported
# tokens); the [[events]] hooks below cover add/delete/move/reorder while the
# server runs. sync-codes is a full re-list + diff, so bursts of events
# converge to one consistent assignment. Hooks run with cwd = plugin root.
[[startup]]
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]

[[events]]
on = "workspace.created"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]

[[events]]
on = "workspace.closed"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]

[[events]]
on = "workspace.moved"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]

[[events]]
on = "workspace.renamed"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]

[[events]]
on = "workspace.reordered"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]

[[events]]
on = "pane.created"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]

[[events]]
on = "pane.closed"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]

[[events]]
on = "pane.exited"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]

[[events]]
on = "pane.moved"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "-c", "if [ -x ./bin/herdr-preview-grid ]; then exec ./bin/herdr-preview-grid sync-codes; else exec go run ./cmd/herdr-preview-grid sync-codes; fi"]
